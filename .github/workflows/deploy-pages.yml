name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the static edition in this disposable checkout
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -eu
          # POST handlers and request-time locale negotiation require a server.
          rm -f proxy.ts app/api/contact/route.ts
          cat > next.config.ts <<'CONFIG'
          import createIntl from 'next-intl/plugin';
          export default createIntl('./i18n/request.ts')({
            output: 'export',
            basePath: process.env.PAGES_BASE_PATH || '',
            trailingSlash: true,
            images: { unoptimized: true }
          });
          CONFIG
          # Only the hosting artifact uses direct email contact.
          cat > components/contact-form.tsx <<'FORM'
          import {getTranslations} from 'next-intl/server';
          import {company} from '@/content/company';
          export async function ContactForm() {
            const t = await getTranslations('contact');
            return <div className="form-panel"><p className="eyebrow">{t('emailLabel')}</p>
              {company.email.includes('@')
                ? <a className="text-link" href={`mailto:${company.email}`}>{company.email}</a>
                : <p>{t('unavailable')}</p>}
            </div>;
          }
          FORM
          # Exclude server-only API tests from this artifact's TypeScript pass.
          rm -f tests/contact.test.ts tests/delivery.test.ts
          for file in app/sitemap.ts app/robots.ts; do
            echo "export const dynamic = 'force-static';" >> "$file"
          done
          npm run build
          cat > out/index.html <<'HTML'
          <!doctype html><html lang="nl"><meta charset="utf-8"><title>Nederlands / English</title>
          <script>
          const saved = document.cookie.match(/(?:^|;\s*)NEXT_LOCALE=(nl|en)(?:;|$)/)?.[1];
          const supported = (navigator.languages || [navigator.language]).map(x => x.split('-')[0]).find(x => ['nl','en'].includes(x));
          location.replace('./' + (saved || supported || 'nl') + '/' + location.search + location.hash);
          </script>
          <a href="./nl/">Nederlands</a> · <a href="./en/">English</a></html>
          HTML
          for lang in nl en; do
            for route in "" privacy/ terms/; do test -s "out/$lang/${route}index.html"; done
          done
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
